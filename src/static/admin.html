<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="/">Inventory</a></li>
        </ul>
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Search parts..." />
            <button id="search-button"><i class="bi bi-search"></i></button>
        </div>
        <div id="profile">
            <img id="user-avatar" alt="Profile" />
            <div id="profile-dropdown" class="dropdown">
                <a href="/profile">Profile</a>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="popup" style="display: none;" id="invite-code-popup">
        <div class="modal">
            <span class="close"><i class="bi bi-x"></i></span>
            <h2>Invite Code</h2>
            <div id="invite-code-details"></div>
        </div>
    </div>
    <div class="container">
        <h1>Admin Panel</h1>
    </div>
    <div class="tab-select">
        <ul>
            <li><a class="tab-link active" data-tab="users">Users</a></li>
            <li><a class="tab-link" data-tab="api-keys">API Keys</a></li>
            <li><a class="tab-link" data-tab="api-usage">API Usage</a></li>
        </ul>
    </div>
    <div class="tab-container">
        <div class="tab-content" id="users">
            <h2>Users</h2>
            <button id="invite" onclick="generateInviteCode()">Create Invite Code</button>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-list"></tbody>
            </table>
        </div>
        <div class="tab-content" id="api-keys">
            <h2>API Keys</h2>
            <table id="api-keys-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Created At</th>
                        <th>Owned By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="api-keys-list"></tbody>
            </table>
        </div>
        <div class="tab-content" id="api-usage">
            <h2>API Usage</h2>
            <table id="api-usage-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>API Key</th>
                        <th>Endpoint</th>
                        <th>Origin</th>
                        <th>Response Code</th>
                    </tr>
                </thead>
                <tbody id="api-usage-list"></tbody>
            </table>
        </div>
    </div>

    <script src="/app.js"></script>
    <script src="/auth.js"></script>
    <script src="/admin.js"></script>
</body>

</html>
