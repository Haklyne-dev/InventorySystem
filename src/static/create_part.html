<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="javascript:history.back()" class="back-button"><i class="bi bi-arrow-left"></i></a>
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Search parts..." />
            <button id="search-button"><i class="bi bi-search"></i></button>
        </div>
        <div id="profile">
            <img id="user-avatar" alt="Profile" src="/images/avatar" />
            <div id="profile-dropdown" class="dropdown">
                <a href="/profile">Profile</a>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1>Create Part</h1>
        <form class="create-part-form">
            <div class="form-group">
                <label for="part-name">Name:</label>
                <input type="text" id="part-name" name="name" required />
            </div>

            <div class="form-group">
                <label for="part-quantity">Quantity:</label>
                <input type="number" id="part-quantity" name="quantity" />
            </div>

            <div class="form-group">
                <label for="part-location">Location:</label>
                <input type="text" id="part-location" name="location" />
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" />
                <ul id="suggestions-box" style="display: none;"></ul>
            </div>

            <div class="form-group">
                <label for="part-description">Description:</label>
                <textarea id="part-description" name="description"></textarea>
            </div>

            <button type="submit">Create Part</button>
            <p id="response-message" class="response-message"></p>
        </form>
    </div>

    <script src="/create_part.js"></script>
    <script src="/app.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
