<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="onboarding-container" style="display:none;">
        <div class="onboarding-content" id="ob-welcome" style="display:none;">
            <h1>Welcome</h1>
            <p>Let's get started.</p>
            <button id="start-onboarding">Start Onboarding</button>
        </div>
        <div class="onboarding-content" id="ob-account" style="display: none;">
            <h2>Account Setup</h2>
            <p>Let's get your account set up.</p>
            <form id="account-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required />
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required />
                </div>
                <button type="submit">Next</button>
            </form>
        </div>
        <div class="onboarding-content" id="ob-loading" style="display: none;">
            <h2>Loading...</h2>
            <p id="loading-text">Loading...</p>
            <div class="loader"></div>
        </div>
        <div class="onboarding-content" id="ob-complete" style="display: none;">
            <h2>Setup Complete</h2>
            <p>Your account and server have been successfully configured.</p>
            <a href="/" class="button-link">Go to Dashboard</a>
        </div>
    </div>
    <script src="/onboarding.js"></script>
</body>

</html>
