<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="onboarding-container">
        <div class="onboarding-content" id="ob-welcome">
            <h1>Welcome</h1>
            <p>Let's get started.</p>
            <button id="start-onboarding">Start Onboarding</button>
        </div>
        <div class="onboarding-content" id="ob-account" style="display: none;">
            <h2>Account Setup</h2>
            <p>Please enter your account details.</p>
            <form id="account-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required />
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
                <button type="submit">Next</button>
            </form>
        </div>
        <div class="onboarding-content" id="ob-server" style="display: none;">
            <h2>Server Configuration</h2>
            <p>Configure your server settings.</p>
            <form id="server-form">
                <label for="server-name">Server Name:</label>
                <input type="text" id="server-name" name="server-name" required />
                <label for="auto-update">Enable Auto-Updates:</label>
                <input type="checkbox" id="auto-update" name="auto-update" />
                <button type="submit">Finish</button>
            </form>
        </div>
        <div class="onboarding-content" id="ob-loading" style="display: none;">
            <h2>Loading...</h2>
            <div class="loader"></div>
            <p>Please wait while we set up your account and server.</p>
        </div>
        <div class="onboarding-content" id="ob-complete" style="display: none;">
            <h2>Setup Complete</h2>
            <p>Your account and server have been successfully configured.</p>
            <button id="go-to-dashboard">Go to Dashboard</button>
        </div>
    </div>
    <script src="/onboarding.js"></script>
</body>

</html>
