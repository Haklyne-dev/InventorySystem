<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="/">Inventory</a></li>
            <li><a href="/checkout">Checkout</a></li>
            <li><a href="/admin" id="admin-link" style="display: none;">Admin</a></li>
        </ul>
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Search parts..." />
            <button id="search-button"><i class="bi bi-search"></i></button>
        </div>
        <div id="profile">
            <img id="user-avatar" alt="Profile" />
            <div id="profile-dropdown" class="dropdown">
                <a href="/profile">Profile</a>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="flex-wrapper">
        <div class="container">
            <img id="part-qr" alt="Part QR Code" />
            <h1 id="part-name"></h1>
            <div id="part-details">
                <p><strong>ID:</strong> <span id="part-id"></span></p>
                <p><strong>Quantity:</strong> <span id="part-quantity"></span></p>
                <p><strong>Location:</strong> <span id="part-location"></span></p>
                <p><strong>Category:</strong> <span id="part-category"></span></p>
            </div>
            <p id="part-description">No description available.</p>
        </div>
        <div class="container">
            <h2>History</h2>
            <div id="history-list">
                <table id="part-history">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Timestamp</th>
                            <th>Description</th>
                            <th>User</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/part.js"></script>
    <script src="/app.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
