<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="/">Inventory</a></li>
            <li><a href="/checkout">Checkout</a></li>
            <li><a href="/admin" id="admin-link" style="display: none;">Admin</a></li>
        </ul>
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Search parts..." />
            <button id="search-button"><i class="bi bi-search"></i></button>
        </div>
        <div id="profile">
            <img id="user-avatar" alt="Profile" src="/images/avatar" />
            <div id="profile-dropdown" class="dropdown">
                <a href="/profile">Profile</a>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1>Search Results</h1>
        <div id="inventory-list">
            <table id="parts-list">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="parts-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="/app.js"></script>
    <script src="/auth.js"></script>
    <script src="/search.js"></script>
</body>

</html>
